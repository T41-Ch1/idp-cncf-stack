# kubernetes/backstage.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage
          image: ghcr.io/t41-ch1/backstage-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            #            - secretRef:
            #                name: postgres-secrets
            - secretRef:
                name: backstage-secrets
# TODO: レジストリのPrivate化対応時にコメントアウトを外す
#      imagePullSecrets:
#        - name: ghcr-image-pull-secret
# Uncomment if health checks are enabled in your app:
# https://backstage.io/docs/plugins/observability#health-checks
